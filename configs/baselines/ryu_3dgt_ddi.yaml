seed: 17
baseline: 3dgt_ddi

paths:
  audit_report: outputs/audit/ryu/audit_report.json
  records: outputs/processed/ryu/records.csv
  split: outputs/splits/ryu/pair_seed17.csv
  conformers: outputs/conformers/ryu
  checkpoints: outputs/checkpoints/baselines/ryu/3dgt_ddi

data:
  # The official 3DGT-DDI DrugBank graph branch uses a 10 Angstrom radius.
  cutoff: 10.0

model:
  hidden_channels: 128
  num_layers: 6
  num_filters: 128
  num_gaussians: 50
  cutoff: 10.0
  graph_channels: 32
  pair_hidden_channels: 64

loss:
  classification: weighted
  max_class_weight: 50.0
  focal_gamma: 2.0

training:
  batch_size: 128
  num_workers: 8
  mixed_precision: bf16
  learning_rate: 0.0002
  weight_decay: 0.00001
  lr_gamma: 0.98
  epochs: 80
  patience: 12
  gradient_clip: 5.0
