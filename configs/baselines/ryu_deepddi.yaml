seed: 17

paths:
  audit_report: outputs/audit/ryu/audit_report.json
  records: outputs/processed/ryu/records.csv
  split: outputs/splits/ryu/pair_seed17.csv
  pca50: data/raw/DeepDDI/data/tanimoto_info_PCA50.csv
  checkpoints: outputs/checkpoints/baselines/ryu/deepddi

model:
  hidden_dim: 2048
  hidden_layers: 9
  batch_norm_epsilon: 0.001
  # Keras momentum=0.99 corresponds to PyTorch momentum=0.01.
  batch_norm_momentum: 0.01

loss:
  # Match DCIA's imbalance treatment so the architecture comparison is fair.
  classification: weighted
  max_class_weight: 50.0
  focal_gamma: 2.0

training:
  # Dense PCA features need no data-loader workers and little activation memory.
  batch_size: 512
  num_workers: 0
  mixed_precision: none
  # The released DeepDDI model was compiled with Adam(lr=1e-3).
  learning_rate: 0.001
  weight_decay: 0.0
  lr_factor: 0.5
  lr_patience: 2
  min_learning_rate: 0.00001
  epochs: 40
  patience: 8
  gradient_clip: 5.0
