seed: 17
baseline: hln_ddi

paths:
  audit_report: outputs/audit/ryu/audit_report.json
  records: outputs/processed/ryu/records.csv
  split: outputs/splits/ryu/pair_seed17.csv
  conformers: outputs/conformers/ryu
  hierarchical_cache: outputs/cache/baselines/ryu/hierarchical_brics_v1.pt
  checkpoints: outputs/checkpoints/baselines/ryu/hln_ddi

model:
  input_dim: 55
  hidden_dim: 128
  layers: 5
  heads: 4
  dropout: 0.2

loss:
  classification: weighted
  max_class_weight: 50.0
  focal_gamma: 2.0

training:
  batch_size: 256
  num_workers: 0
  mixed_precision: none
  learning_rate: 0.001
  weight_decay: 0.0005
  lr_gamma: 0.98
  epochs: 150
  patience: 15
  gradient_clip: 5.0
