seed: 17
baseline: meta3d_ddi

paths:
  audit_report: outputs/audit/ryu/audit_report.json
  records: outputs/processed/ryu/records.csv
  split: outputs/splits/ryu/pair_seed17.csv
  conformers: outputs/conformers/ryu
  checkpoints: outputs/checkpoints/baselines/ryu/meta3d_ddi

data:
  cutoff: 5.0

model:
  hidden_channels: 128
  num_layers: 6
  num_gaussians: 50
  cutoff: 5.0
  dropout: 0.10
  decoder_hidden_channels: 256

loss:
  classification: weighted
  max_class_weight: 50.0
  focal_gamma: 2.0

training:
  batch_size: 128
  num_workers: 8
  mixed_precision: bf16
  learning_rate: 0.0002
  weight_decay: 0.00001
  lr_gamma: 0.98
  epochs: 80
  patience: 12
  gradient_clip: 5.0
