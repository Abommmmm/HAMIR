seed: 17
baseline: ssi_ddi

paths:
  audit_report: outputs/audit/ryu/audit_report.json
  records: outputs/processed/ryu/records.csv
  split: outputs/splits/ryu/pair_seed17.csv
  conformers: outputs/conformers/ryu
  graph_cache: outputs/cache/baselines/ryu/molecular_graphs_55.pt
  checkpoints: outputs/checkpoints/baselines/ryu/ssi_ddi

model:
  input_dim: 55
  kge_dim: 64
  head_output_features: [32, 32, 32, 32]
  heads: [2, 2, 2, 2]

loss:
  classification: weighted
  max_class_weight: 50.0
  focal_gamma: 2.0

training:
  batch_size: 512
  num_workers: 0
  mixed_precision: none
  learning_rate: 0.01
  weight_decay: 0.0005
  lr_gamma: 0.96
  epochs: 300
  patience: 10
  gradient_clip: 5.0
