seed: 17

paths:
  train_index: outputs/reaction_sites/enzymemap_finetune/index/train.jsonl
  valid_index: outputs/reaction_sites/enzymemap_finetune/index/valid.jsonl
  test_index: outputs/reaction_sites/enzymemap_finetune/index/test.jsonl
  preparation_report: outputs/reaction_sites/enzymemap_finetune/split_report.json
  molecule_cache: outputs/reaction_sites/enzymemap/molecules
  geometry_report: outputs/reaction_sites/enzymemap/geometry_report.json
  checkpoints: outputs/checkpoints/reaction_sites/uspto50k/painn_a2_hierarchical_motif
  results: outputs/results/reaction_sites/enzymemap/painn_a2_split_zero_shot

data:
  max_atoms_per_molecule: 128
  conformer_max_iters: 100

model:
  hidden_dim: 128
  painn_layers: 5
  num_rbf: 20
  cutoff: 5.0
  dropout: 0.10
  architecture: hierarchical_motif
  attention_heads: 4
  attention_topk: 4

training:
  device: cuda
  batch_size: 64
  num_workers: 6
  mixed_precision: fp16
  threshold: 0.5
